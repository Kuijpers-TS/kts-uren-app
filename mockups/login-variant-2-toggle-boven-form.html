<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Login mockup variant 2 — Toggle boven inlogformulier</title>
<style>
  :root {
    --kts-blue: #043B56;
    --kts-blue-light: #07567F;
    --kts-orange: #E97724;
    --app-ink-900: #0f172a;
    --app-ink-700: #334155;
    --app-ink-400: #94a3b8;
    --app-ink-200: #e2e8f0;
    --app-ink-100: #f1f5f9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0A1628 0%, #043B56 40%, #07567F 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .pattern {
    position: fixed; inset: 0; opacity: 0.04; pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 50%, white 1px, transparent 1px),
      radial-gradient(circle at 80% 20%, white 1px, transparent 1px),
      radial-gradient(circle at 60% 80%, white 1px, transparent 1px);
    background-size: 60px 60px, 80px 80px, 90px 90px;
  }
  .container { position: relative; z-index: 1; width: 100%; max-width: 680px; padding: 24px; }
  .card {
    background: white; border-radius: 24px; overflow: hidden;
    box-shadow: 0 12px 48px rgba(0,0,0,0.2);
    display: flex; flex-direction: row; min-height: 460px;
  }
  .logo-panel {
    flex: 0 0 240px;
    background: white;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 28px;
    border-right: 3px solid var(--kts-blue);
  }
  .logo-panel .logo-text {
    font-weight: 700; font-size: 16px; color: var(--kts-blue);
    text-align: center; line-height: 1.4;
  }
  .form-panel {
    flex: 1; padding: 36px 32px;
    display: flex; flex-direction: column; justify-content: center;
  }

  .app-toggle {
    display: flex; background: var(--app-ink-100); border-radius: 12px;
    padding: 4px; margin-bottom: 24px;
    position: relative;
  }
  .app-toggle button {
    flex: 1; padding: 10px 12px; border: none; background: transparent;
    cursor: pointer; border-radius: 9px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--app-ink-400);
    transition: all 0.18s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .app-toggle button.active {
    background: white; color: var(--kts-blue);
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .app-toggle button.active.inspectie { color: var(--kts-orange); }
  .app-toggle button svg { width: 14px; height: 14px; }

  .welkom-line {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px; font-weight: 500; color: var(--app-ink-400);
    letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px;
    transition: color 0.18s;
  }
  .welkom-line.inspectie { color: var(--kts-orange); }
  .welkom-title {
    font-weight: 600; font-size: 20px; color: var(--app-ink-900);
    letter-spacing: -0.005em; margin-bottom: 24px;
  }

  .form-row { margin-bottom: 16px; }
  .form-row label {
    display: block; font-size: 13px; font-weight: 500;
    color: var(--app-ink-700); margin-bottom: 6px;
  }
  .input-wrap { position: relative; }
  .input-wrap svg {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--app-ink-400); pointer-events: none;
  }
  .input-wrap input {
    width: 100%; padding: 11px 14px 11px 40px;
    border: 1px solid var(--app-ink-200); border-radius: 10px;
    font-size: 14px; font-family: inherit;
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  .input-wrap input:focus {
    outline: none; border-color: var(--kts-blue);
    box-shadow: 0 0 0 3px rgba(4,59,86,0.12);
  }

  .btn-primary {
    width: 100%; padding: 13px;
    background: var(--kts-blue); color: white;
    border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background 0.18s;
    margin-top: 8px;
  }
  .btn-primary:hover { background: var(--kts-blue-light); }
  .btn-primary.inspectie { background: var(--kts-orange); }
  .btn-primary.inspectie:hover { background: #f59c4f; }

  .forgot {
    text-align: center; margin-top: 14px;
    font-size: 13px; color: var(--kts-blue);
    text-decoration: none; display: block;
  }

  .footer {
    text-align: center; margin-top: 24px;
    color: rgba(255,255,255,0.25); font-size: 11px;
  }

  @media (max-width: 600px) {
    .card { flex-direction: column; }
    .logo-panel { flex: 0 0 auto; padding: 24px; border-right: none; border-bottom: 3px solid var(--kts-blue); }
  }
</style>
</head>
<body>
  <div class="pattern"></div>
  <div class="container">
    <div class="card">
      <div class="logo-panel">
        <div class="logo-text">Kuijpers<br>Technical<br>Services</div>
      </div>

      <div class="form-panel">
        <div class="app-toggle">
          <button class="active" onclick="switchApp(this, 'uren')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            KTS Uren
          </button>
          <button onclick="switchApp(this, 'inspectie')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            KTS Inspectie
          </button>
        </div>

        <div class="welkom-line" id="welkomLine">KTS Uren App</div>
        <div class="welkom-title">Welkom terug</div>

        <form onsubmit="event.preventDefault()">
          <div class="form-row">
            <label>E-mailadres</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" placeholder="naam@bedrijf.nl">
            </div>
          </div>

          <div class="form-row">
            <label>Wachtwoord</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
              <input type="password" placeholder="••••••••">
            </div>
          </div>

          <button type="submit" class="btn-primary" id="loginBtn">Inloggen</button>
          <a href="#" class="forgot" onclick="event.preventDefault()">Wachtwoord vergeten?</a>
        </form>
      </div>
    </div>

    <div class="footer">© 2026 Kuijpers Technical Services BV · Waarland</div>
  </div>

<script>
  function switchApp(btn, app) {
    document.querySelectorAll('.app-toggle button').forEach(b => b.classList.remove('active', 'inspectie'));
    btn.classList.add('active');
    const welkomLine = document.getElementById('welkomLine');
    const loginBtn = document.getElementById('loginBtn');
    if (app === 'inspectie') {
      btn.classList.add('inspectie');
      welkomLine.classList.add('inspectie');
      welkomLine.textContent = 'KTS Inspectie App';
      loginBtn.classList.add('inspectie');
    } else {
      welkomLine.classList.remove('inspectie');
      welkomLine.textContent = 'KTS Uren App';
      loginBtn.classList.remove('inspectie');
    }
  }
</script>
</body>
</html>
